name: campride
description: "KNUST Shuttle Route Finder - Frontend"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  go_router: ^14.6.2
  provider: ^6.1.2
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  http: ^1.1.0
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.0.0
  geolocator: ^9.0.0
  web_socket_channel: ^2.4.0
  firebase_core: ^4.12.0
  firebase_messaging: ^16.4.0
  google_maps_flutter: ^2.7.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
